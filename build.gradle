buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

// Services that own a schema and a set of Flyway migrations. Each gets a
// context test that boots against a throwaway Postgres, so `ddl-auto: validate`
// checks the JPA mappings against the schema the migrations actually produce.
def databaseBackedModules = [
        'account', 'file', 'karma', 'language', 'lending-gallery',
        'license', 'mail', 'notification', 'payment', 'permission',
]

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.gliesereum'
    version = '0.1.4'
    sourceCompatibility = 11

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    // Every module used to repeat these four.
    dependencies {
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        compileOnly "org.springframework.boot:spring-boot-configuration-processor"
        testImplementation "org.springframework.boot:spring-boot-starter-test"
    }

    if (name in databaseBackedModules) {
        dependencies {
            testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
            testRuntimeOnly 'org.postgresql:postgresql'
        }
    }

    test {
        // Resolved inside each application-test.yml's Testcontainers JDBC URL,
        // so the image tag stays pinned in one place.
        systemProperty 'postgres.test.tag', postgresTestTag
        testLogging {
            exceptionFormat = 'full'
            events 'failed'
        }
    }
}
