# Boots the service against a throwaway Postgres started by Testcontainers via
# the `jdbc:tc:` URL. Flyway builds the schema, then `ddl-auto: validate` checks
# every JPA mapping against it.
spring:
  # TelegramBotInitializer registers every LongPollingBot bean with Telegram
  # during startup, so the context cannot come up without a live token and
  # network. Excluded here; the bot bean itself is still constructed.
  autoconfigure:
    exclude: org.telegram.telegrambots.starter.TelegramBotStarterConfiguration

  datasource:
    url: jdbc:tc:postgresql:${postgres.test.tag}:///gliesereum
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${db.schema}
        temp:
          use_jdbc_metadata_defaults: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/all
    baseline-version: 1
    sql-migration-suffixes: .sql
    sql-migration-prefix: V
    schemas: ${db.schema}

  # No broker in tests; the queue beans are still built, the listener containers
  # just do not try to connect. The queue names are only declared in the docker
  # and remote profiles, so they have to be repeated here.
  rabbitmq:
    queue-logstash: logstash
    queue-logstash-system: logstash-system
    queue-logstash-request: logstash-request
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Written to a temp file by ApplicationContextTest before the context starts.
# Not a checked-in file: a service-account JSON in the repository is
# indistinguishable from a leaked one.
firebase:
  properties:
    credentialPath: ${firebase.test.credential-path}
    appName: gliesereum-test
