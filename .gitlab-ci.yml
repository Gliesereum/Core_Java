stages:
  - prebuild
  - build
  - package
  - deploy

variables:
  PROJECT_HOME: "/usr/gliesereum"
  # Must match the version in the root build.gradle and the image tags in
  # docker/docker-compose-*.yml.
  VERSION: "0.1.4"
  COMPOSE_FILE: "docker/docker-compose-dev-log.yml"
  STACK: "gls"

git-pull:
  stage: prebuild
  script:
    - echo 'Git pull'
    - cd $PROJECT_HOME
    - sudo git pull
  only:
    - gls/dev

# One multi-project build instead of fourteen `gradle -b=<module>/build.gradle`
# invocations, using the wrapper so the Gradle version is the repo's choice and
# not whatever the runner happens to have installed.
gradle-build:
  stage: build
  script:
    - echo 'Gradle build'
    - cd $PROJECT_HOME
    - ./gradlew clean build --no-daemon
  only:
    - gls/dev

docker-image-package:
  stage: package
  script:
    - echo 'Docker build images'
    - cd $PROJECT_HOME
    - sudo docker build --rm -t gls-discovery:$VERSION       -f docker/discovery/Dockerfile       ./discovery/build/libs/
    - sudo docker build --rm -t gls-account:$VERSION         -f docker/account/Dockerfile         ./account/build/libs/
    - sudo docker build --rm -t gls-proxy:$VERSION           -f docker/proxy/Dockerfile           ./proxy/build/libs/
    - sudo docker build --rm -t gls-mail:$VERSION            -f docker/mail/Dockerfile            ./mail/build/libs/
    - sudo docker build --rm -t gls-permission:$VERSION      -f docker/permission/Dockerfile      ./permission/build/libs/
    - sudo docker build --rm -t gls-karma:$VERSION           -f docker/karma/Dockerfile           ./karma/build/libs/
    - sudo docker build --rm -t gls-file:$VERSION            -f docker/file/Dockerfile            ./file/build/libs/
    - sudo docker build --rm -t gls-lending-gallery:$VERSION -f docker/lending-gallery/Dockerfile ./lending-gallery/build/libs/
    - sudo docker build --rm -t gls-notification:$VERSION    -f docker/notification/Dockerfile    ./notification/build/libs/
    - sudo docker build --rm -t gls-language:$VERSION        -f docker/language/Dockerfile        ./language/build/libs/
    - sudo docker build --rm -t gls-curator:$VERSION         -f docker/curator/Dockerfile         ./config/elk/
  only:
    - gls/dev

# `docker stack deploy` reconciles services in place: Swarm rolls tasks over one
# by one and leaves the previous image running until the new one is up. The old
# pipeline tore the whole stack down with `docker stack rm` plus
# `docker rm --force $(docker ps -aq)` before rebuilding, which meant full
# downtime on every commit. Use `full-redeploy` below when a clean slate is
# genuinely needed.
docker-deploy:
  stage: deploy
  script:
    - echo 'Docker deploy'
    - cd $PROJECT_HOME
    - docker stack deploy -c $COMPOSE_FILE $STACK
    - docker stack services $STACK
  only:
    - gls/dev

full-redeploy:
  stage: deploy
  when: manual
  script:
    - echo 'Tearing the stack down and redeploying from scratch'
    - cd $PROJECT_HOME
    - docker stack rm $STACK
    - sleep 30
    - docker stack deploy -c $COMPOSE_FILE $STACK
    - docker stack services $STACK
  only:
    - gls/dev
