dependencies {
    // Spring Cloud Gateway is reactive; spring-boot-starter-web must stay out of
    // this module or the gateway refuses to start.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation "org.apache.commons:commons-collections4:${commonsCollectionsVersion}"
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    implementation "org.modelmapper:modelmapper:${modelMapperVersion}"
    implementation "io.jsonwebtoken:jjwt:${jjwtVersion}"
    // share's UserAuthentication extends UsernamePasswordAuthenticationToken.
    // Only the core types are needed: pulling spring-boot-starter-security would
    // put spring-security-config on the classpath and auto-configure a reactive
    // filter chain the gateway does not want.
    implementation 'org.springframework.security:spring-security-core'

    // JDK 11 removed java.xml.bind, which the Eureka client's XML codecs need.
    implementation "javax.xml.bind:jaxb-api:${jaxbApiVersion}"
    implementation "com.sun.xml.bind:jaxb-core:${jaxbCoreVersion}"
    implementation "com.sun.xml.bind:jaxb-impl:${jaxbImplVersion}"
    implementation "javax.activation:activation:${javaxActivationVersion}"

    implementation "org.cache2k:cache2k-api:${cache2kVersion}"
    implementation "org.cache2k:cache2k-jcache:${cache2kVersion}"
    runtimeOnly "org.cache2k:cache2k-core:${cache2kVersion}"

    implementation(project(':share')) {
        transitive = false
    }

    testImplementation 'com.squareup.okhttp3:mockwebserver'
}
