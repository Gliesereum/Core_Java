# Routes one stub path at a MockWebServer the test starts, so the gateway's
# own behaviour (application check, bearer handling, header propagation,
# prefix stripping) can be asserted without Eureka or any real service.
spring:
  rabbitmq:
    queue-logstash: logstash
    queue-logstash-system: logstash-system
    queue-logstash-request: logstash-request
    listener:
      simple:
        auto-startup: false
  cloud:
    gateway:
      routes:
        - id: stub-service
          uri: ${downstream.url}
          predicates:
            - Path=/api/stub/v1/**
          filters:
            - StripPrefix=3

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
