# serivce name
spring:
  application:
    name: proxy-service
  codec:
    # Replaces the servlet multipart limits; on WebFlux this caps the in-memory
    # buffer for a request body.
    max-in-memory-size: 10MB
  cloud:
    gateway:
      httpclient:
        connect-timeout: 30000
        response-timeout: 30s
      routes:
        # Every route strips three segments — /api, the module and the version —
        # because the downstream controllers are mapped at the bare path
        # (/user, /record, ...). That is what Zuul's stripPrefix did, with /api
        # having come from server.servlet.context-path.
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/account/v1/**
          filters:
            - StripPrefix=3
        - id: permission-service
          uri: lb://permission-service
          predicates:
            - Path=/api/permission/v1/**
          filters:
            - StripPrefix=3
        - id: mail-service
          uri: lb://mail-service
          predicates:
            - Path=/api/mail/v1/**
          filters:
            - StripPrefix=3
        - id: karma-service
          uri: lb://karma-service
          predicates:
            - Path=/api/karma/v1/**
          filters:
            - StripPrefix=3
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/file/v1/**
          filters:
            - StripPrefix=3
        - id: lending-gallery-service
          uri: lb://lending-gallery-service
          predicates:
            - Path=/api/lending-gallery/v1/**
          filters:
            - StripPrefix=3
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/v1/**
          filters:
            - StripPrefix=3
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/v1/**
          filters:
            - StripPrefix=3
        - id: license-service
          uri: lb://license-service
          predicates:
            - Path=/api/license/v1/**
          filters:
            - StripPrefix=3
        - id: language-service
          uri: lb://language-service
          predicates:
            - Path=/api/language/v1/**
          filters:
            - StripPrefix=3

server:
  port: 8200

# Prefix stripped before a path is read as module + endpoint by the endpoint
# keeper. Used to be read from the never-configured zuul.prefix.
gateway:
  prefix: /api

ribbon:
  ConnectTimeout: 60000
  ReadTimeout: 80000

# eureka server url
eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.host:localhost}:${eureka.port:8761}/eureka
    registry-fetch-interval-seconds: 20
    availability-zones:
      default: defaultZone
    region: default
    enabled: true
  instance:
    prefer-ip-address: true

system-notification:
  update-auth-info:
    exchange-name: system-notification-update-auth-info

security:
  properties:
    checkApplicationId: http://permission-service/application/check
    checkAccessUrl: http://account-service/auth/check
    applicationIdHeader: Application-Id
    applicationIdHeaderRequired: true
    notRequiredApplicationIdHosts: status, swagger-ui.html.*, .*/api-docs, .*\/springfox-swagger-ui\/.*, swagger-resources.*
    bearerHeader: Authorization
    bearerPrefix: Bearer
    jwtHeader: Service-Authorization
    jwtPrefix: JWT
    jwtSecret: CnfxFqbCKHLqzT9LGruE
    endpointKeeperEnable: false
    getUserGroupUrl: http://permission-service/group-user/my-group
    getPermissionMapUrl: http://permission-service/group/permission-map/by-group
