# Single source of truth for every third-party version in the build.
# Modules must not redeclare these; add new ones here.

# --- platform ---------------------------------------------------------------
springBootVersion=2.2.13.RELEASE
springCloudVersion=Hoxton.SR12

# --- shared libraries -------------------------------------------------------
commonsCollectionsVersion=4.4
commonsLangVersion=3.12.0
commonsIOVersion=2.11.0
apacheCsvVersion=1.9.0
modelMapperVersion=2.4.5
jjwtVersion=0.9.1
lombokVersion=1.18.30
swaggerVersion=2.9.2

# --- JAXB shims, required because JDK 11 dropped java.xml.bind --------------
# Removed once the build moves off Java 11 (see the Java 17 step).
jaxbApiVersion=2.3.1
jaxbCoreVersion=2.3.0.1
jaxbImplVersion=2.3.2
javaxActivationVersion=1.1.1

# --- module specific --------------------------------------------------------
springDataJestVersion=3.3.4.RELEASE
awsVersion=1.11.475
firebaseAdminVersion=6.8.0
telegramBotVersion=4.4.0.1
cache2kVersion=1.2.0.Final
qrgenVersion=1.4
yahooFinanceVersion=3.14.0
reactorNettyVersion=0.8.5.RELEASE

# --- test only --------------------------------------------------------------
testcontainersVersion=1.21.4
# Matches postgres:10.5-alpine in docker/docker-compose-*.yml, so migrations are
# verified against the version the stack actually runs. Reaches the tests as the
# `postgres.test.tag` system property, used by each application-test.yml.
postgresTestTag=10.5-alpine

org.gradle.jvmargs=-Xmx2g
